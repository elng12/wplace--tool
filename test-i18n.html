<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试多语言系统</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; }
        button { margin: 5px; padding: 10px; cursor: pointer; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
    </style>
</head>
<body>
    <h1>多语言系统测试</h1>
    
    <div class="test-section">
        <h2>测试元素</h2>
        <p data-lang="title">标题将在这里显示</p>
        <p data-lang="nav.home">主页将在这里显示</p>
        <p data-lang="pixel.size">像素大小将在这里显示</p>
    </div>
    
    <div class="test-section">
        <h2>语言切换</h2>
        <button onclick="testLanguage('en')">English</button>
        <button onclick="testLanguage('zh')">中文</button>
        <button onclick="testLanguage('pt-BR')">Português</button>
        <button onclick="testLanguage('fr')">Français</button>
        <button onclick="testLanguage('ja')">日本語</button>
        <button onclick="testLanguage('tr')">Türkçe (不支持)</button>
    </div>
    
    <div class="test-section">
        <h2>测试结果</h2>
        <div id="results"></div>
    </div>
    
    <div class="test-section">
        <h2>LocalStorage 状态</h2>
        <div id="storage-info"></div>
        <button onclick="clearStorage()">清除 LocalStorage</button>
    </div>
    
    <script src="js/i18n.js"></script>
    <script>
        const resultsDiv = document.getElementById('results');
        const storageDiv = document.getElementById('storage-info');
        
        function log(message, type = 'info') {
            const p = document.createElement('p');
            p.className = type;
            p.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            resultsDiv.appendChild(p);
        }
        
        async function testLanguage(lang) {
            log(`测试语言: ${lang}`);
            try {
                await window.i18n.loadLanguage(lang);
                log(`✅ 成功切换到: ${lang}, 当前语言: ${window.i18n.currentLang}`, 'success');
                updateStorageInfo();
            } catch (error) {
                log(`❌ 切换失败: ${error.message}`, 'error');
            }
        }
        
        function updateStorageInfo() {
            const saved = localStorage.getItem('wplace-language');
            storageDiv.innerHTML = `
                <p>保存的语言: <strong>${saved || '无'}</strong></p>
                <p>当前语言: <strong>${window.i18n.currentLang}</strong></p>
                <p>已加载的语言: <strong>${Object.keys(window.i18n.translations).join(', ')}</strong></p>
            `;
        }
        
        function clearStorage() {
            localStorage.removeItem('wplace-language');
            log('✅ LocalStorage 已清除', 'success');
            updateStorageInfo();
        }
        
        // 初始化时更新信息
        window.addEventListener('DOMContentLoaded', () => {
            updateStorageInfo();
            log('多语言系统已初始化', 'info');
        });
    </script>
</body>
</html>
