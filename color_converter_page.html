<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>颜色转换器 - WPlace Tool</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav {
            text-align: center;
            margin-bottom: 30px;
        }

        .nav a {
            color: #667eea;
            text-decoration: none;
            margin: 0 10px;
            padding: 8px 16px;
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        .nav a:hover {
            background: #667eea;
            color: white;
        }

        .converter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .input-group {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .input-group:focus-within {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 1.1em;
        }

        input[type="text"], input[type="color"], input[type="range"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus, input[type="color"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        input[type="color"] {
            height: 60px;
            cursor: pointer;
            border-radius: 30px;
        }

        input[type="range"] {
            margin: 10px 0;
        }

        .color-preview {
            width: 100%;
            height: 100px;
            border-radius: 15px;
            border: 3px solid #e1e5e9;
            margin: 15px 0;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .rgb-controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .rgb-control {
            text-align: center;
        }

        .rgb-control label {
            font-size: 0.9em;
            color: #666;
        }

        .rgb-control input[type="range"] {
            margin: 5px 0;
        }

        .rgb-value {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 5px;
            text-align: center;
            font-weight: bold;
        }

        .copy-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            margin-left: 10px;
        }

        .copy-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .result-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .result-item {
            background: #fff;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #e1e5e9;
            text-align: center;
        }

        .result-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .result-value {
            font-family: 'Courier New', monospace;
            background: #f8f9fa;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #ddd;
            margin-bottom: 8px;
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
                padding: 20px;
            }
            
            h1 {
                font-size: 2em;
            }
            
            .converter-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>颜色转换器</h1>
        
        <nav class="nav">
            <a href="/">首页</a>
            <a href="/about.html">关于</a>
            <a href="/blog.html">博客</a>
            <a href="/color-converter.html">颜色转换</a>
        </nav>

        <div class="converter-grid">
            <div class="input-group">
                <label for="colorPicker">选择颜色</label>
                <input type="color" id="colorPicker" value="#3366ff">
                <div id="colorPreview" class="color-preview"></div>
            </div>

            <div class="input-group">
                <label for="hexInput">HEX 颜色值</label>
                <div style="display: flex; align-items: center;">
                    <input type="text" id="hexInput" placeholder="#3366ff" value="#3366ff">
                    <button class="copy-btn" onclick="copyToClipboard('hexInput')">复制</button>
                </div>
            </div>
        </div>

        <div class="input-group">
            <label>RGB 调色器</label>
            <div class="rgb-controls">
                <div class="rgb-control">
                    <label>红 (R)</label>
                    <input type="range" id="redSlider" min="0" max="255" value="51">
                    <div class="rgb-value" id="redValue">51</div>
                </div>
                <div class="rgb-control">
                    <label>绿 (G)</label>
                    <input type="range" id="greenSlider" min="0" max="255" value="102">
                    <div class="rgb-value" id="greenValue">102</div>
                </div>
                <div class="rgb-control">
                    <label>蓝 (B)</label>
                    <input type="range" id="blueSlider" min="0" max="255" value="255">
                    <div class="rgb-value" id="blueValue">255</div>
                </div>
            </div>
        </div>

        <div class="result-grid">
            <div class="result-item">
                <div class="result-label">HEX</div>
                <div class="result-value" id="hexResult">#3366ff</div>
                <button class="copy-btn" onclick="copyToClipboard('hexResult')">复制</button>
            </div>
            <div class="result-item">
                <div class="result-label">RGB</div>
                <div class="result-value" id="rgbResult">rgb(51, 102, 255)</div>
                <button class="copy-btn" onclick="copyToClipboard('rgbResult')">复制</button>
            </div>
            <div class="result-item">
                <div class="result-label">HSL</div>
                <div class="result-value" id="hslResult">hsl(228, 100%, 60%)</div>
                <button class="copy-btn" onclick="copyToClipboard('hslResult')">复制</button>
            </div>
            <div class="result-item">
                <div class="result-label">RGBA</div>
                <div class="result-value" id="rgbaResult">rgba(51, 102, 255, 1)</div>
                <button class="copy-btn" onclick="copyToClipboard('rgbaResult')">复制</button>
            </div>
        </div>
    </div>

    <script>
        // 获取所有控件
        const colorPicker = document.getElementById('colorPicker');
        const hexInput = document.getElementById('hexInput');
        const colorPreview = document.getElementById('colorPreview');
        const redSlider = document.getElementById('redSlider');
        const greenSlider = document.getElementById('greenSlider');
        const blueSlider = document.getElementById('blueSlider');
        const redValue = document.getElementById('redValue');
        const greenValue = document.getElementById('greenValue');
        const blueValue = document.getElementById('blueValue');

        // 结果显示元素
        const hexResult = document.getElementById('hexResult');
        const rgbResult = document.getElementById('rgbResult');
        const hslResult = document.getElementById('hslResult');
        const rgbaResult = document.getElementById('rgbaResult');

        // 颜色转换函数
        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : null;
        }

        function rgbToHex(r, g, b) {
            return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
        }

        function rgbToHsl(r, g, b) {
            r /= 255;
            g /= 255;
            b /= 255;
            const max = Math.max(r, g, b);
            const min = Math.min(r, g, b);
            let h, s, l = (max + min) / 2;

            if (max === min) {
                h = s = 0;
            } else {
                const d = max - min;
                s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                switch (max) {
                    case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                    case g: h = (b - r) / d + 2; break;
                    case b: h = (r - g) / d + 4; break;
                }
                h /= 6;
            }

            return {
                h: Math.round(h * 360),
                s: Math.round(s * 100),
                l: Math.round(l * 100)
            };
        }

        // 更新所有颜色显示
        function updateAllColors(r, g, b) {
            const hex = rgbToHex(r, g, b);
            const hsl = rgbToHsl(r, g, b);
            const rgbColor = `rgb(${r}, ${g}, ${b})`;

            // 更新显示
            colorPreview.style.backgroundColor = rgbColor;
            colorPicker.value = hex;
            hexInput.value = hex;
            
            // 更新滑块值
            redSlider.value = r;
            greenSlider.value = g;
            blueSlider.value = b;
            redValue.textContent = r;
            greenValue.textContent = g;
            blueValue.textContent = b;

            // 更新结果
            hexResult.textContent = hex;
            rgbResult.textContent = rgbColor;
            hslResult.textContent = `hsl(${hsl.h}, ${hsl.s}%, ${hsl.l}%)`;
            rgbaResult.textContent = `rgba(${r}, ${g}, ${b}, 1)`;
        }

        // 事件监听器
        colorPicker.addEventListener('input', function() {
            const rgb = hexToRgb(this.value);
            if (rgb) {
                updateAllColors(rgb.r, rgb.g, rgb.b);
            }
        });

        hexInput.addEventListener('input', function() {
            let hex = this.value;
            if (!hex.startsWith('#')) {
                hex = '#' + hex;
            }
            
            if (/^#[0-9A-F]{6}$/i.test(hex)) {
                const rgb = hexToRgb(hex);
                if (rgb) {
                    updateAllColors(rgb.r, rgb.g, rgb.b);
                }
            }
        });

        // RGB 滑块事件
        function updateFromSliders() {
            const r = parseInt(redSlider.value);
            const g = parseInt(greenSlider.value);
            const b = parseInt(blueSlider.value);
            updateAllColors(r, g, b);
        }

        redSlider.addEventListener('input', updateFromSliders);
        greenSlider.addEventListener('input', updateFromSliders);
        blueSlider.addEventListener('input', updateFromSliders);

        // 复制到剪贴板功能
        function copyToClipboard(elementId) {
            const element = document.getElementById(elementId);
            const text = element.textContent || element.value;
            
            navigator.clipboard.writeText(text).then(() => {
                // 显示复制成功提示
                const btn = event.target;
                const originalText = btn.textContent;
                btn.textContent = '已复制!';
                btn.style.background = '#28a745';
                
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.style.background = 'linear-gradient(135deg, #667eea, #764ba2)';
                }, 1000);
            }).catch(err => {
                console.error('复制失败: ', err);
                alert('复制失败，请手动复制');
            });
        }

        // 初始化
        updateAllColors(51, 102, 255);
    </script>
</body>
</html>
