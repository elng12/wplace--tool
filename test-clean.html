<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>清理后功能测试 - Wplace像素艺术转换器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .drag-over {
            background-color: #e0f2fe !important;
            border-color: #0284c7 !important;
        }
        
        .canvas-container {
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        canvas {
            border: 1px solid #dee2e6;
            border-radius: 8px;
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body class="bg-gray-50">
    <div class="container mx-auto px-4 py-8">
        <div class="bg-blue-50 border border-blue-200 rounded-lg p-4 mb-6">
            <h1 class="text-2xl font-bold text-blue-800 mb-2">✅ 清理完成测试</h1>
            <p class="text-blue-700">已删除所有不存在文件的引用，现在测试自动处理功能</p>
        </div>

        <div class="bg-white rounded-lg shadow-lg p-6">
            <!-- 上传区域 -->
            <div id="uploadArea" class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center cursor-pointer hover:border-gray-400 transition-colors">
                <div class="space-y-4">
                    <div class="text-4xl">📸</div>
                    <div>
                        <p class="text-lg font-medium text-gray-700">点击或拖拽上传图片</p>
                        <p class="text-sm text-gray-500">支持 JPG, PNG, GIF 格式</p>
                    </div>
                </div>
                <input type="file" id="fileInput" accept="image/*" class="hidden">
            </div>

            <!-- 上传提示 -->
            <div id="upload-prompt" class="text-center py-4">
                <p class="text-gray-600">请选择一张图片开始测试</p>
            </div>

            <!-- 参数控制 -->
            <div class="mt-6 grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">像素大小</label>
                    <div class="flex items-center space-x-3">
                        <input type="range" id="size-slider" min="2" max="32" value="8" class="flex-1">
                        <span id="size-value" class="text-sm font-medium w-8">8</span>
                    </div>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">质量</label>
                    <div class="flex items-center space-x-3">
                        <input type="range" id="quality-slider" min="50" max="100" value="85" class="flex-1">
                        <span id="quality-value" class="text-sm font-medium w-12">85%</span>
                    </div>
                </div>
                
                <!-- 隐藏的必需元素 -->
                <div style="display: none;">
                    <input type="range" id="brightness-slider" min="-50" max="50" value="0">
                    <input type="range" id="contrast-slider" min="-50" max="50" value="0">
                    <input type="range" id="saturation-slider" min="-50" max="50" value="0">
                    <input type="checkbox" id="dithering-checkbox">
                </div>
            </div>

            <!-- 图片显示区域 -->
            <div class="mt-6">
                <div class="bg-gray-50 rounded-lg p-4">
                    <h3 class="text-lg font-medium text-gray-700 mb-3">处理结果</h3>
                    <div class="canvas-container">
                        <canvas id="preview-canvas" style="display: none;" class="hidden"></canvas>
                        <canvas id="output-canvas" style="display: none;" class="hidden"></canvas>
                        <div id="result-placeholder" class="text-gray-400 text-center">
                            <div class="text-2xl mb-2">🎨</div>
                            <p>上传图片后将自动处理并显示像素艺术结果</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 下载按钮 -->
            <div class="mt-6 flex justify-center space-x-4">
                <button id="download-btn" disabled class="hidden px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:bg-gray-400 disabled:cursor-not-allowed">
                    下载结果
                </button>
                <button id="reset-btn" class="px-6 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700">
                    重置
                </button>
            </div>
        </div>
    </div>

    <!-- Toast 通知 -->
    <div id="toast-container" class="fixed top-4 right-4 z-50 space-y-2"></div>

    <!-- 进度条 -->
    <div id="progress-bar" class="fixed top-0 left-0 w-full h-1 bg-blue-600 transform scale-x-0 origin-left transition-transform duration-300 z-50" style="display: none;"></div>

    <!-- 引入清理后的脚本 -->
    <script src="js/image-optimizer.js"></script>
    <script src="js/app-simple.js"></script>
</body>
</html>
