<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Page not found - Wplace Paint Tool" />
  
  <!-- HTTPS安全设置 -->
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
  <meta http-equiv="Strict-Transport-Security" content="max-age=31536000; includeSubDomains; preload">
  
  <title>404 - Page Not Found | Wplace Paint Tool</title>
  <link rel="canonical" href="https://wplacetool.app/404.html" />
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/main.css" />
  
  <!-- 翻译系统 -->
  <script src="js/i18n.js"></script>
  
  <style>
    body {
      margin: 0;
      padding: 0;
      font-size: 16px;
      line-height: 1.5;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
    }
    
    .error-container {
      text-align: center;
      padding: 2rem;
      max-width: 600px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(10px);
    }
    
    .error-code {
      font-size: 8rem;
      font-weight: bold;
      color: #667eea;
      margin: 0;
      line-height: 1;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
    }
    
    .error-title {
      font-size: 2rem;
      color: #333;
      margin: 1rem 0;
      font-weight: 600;
    }
    
    .error-message {
      font-size: 1.1rem;
      color: #666;
      margin: 1.5rem 0;
      line-height: 1.6;
    }
    
    .error-actions {
      margin-top: 2rem;
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    
    .btn {
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 500;
      transition: all 0.3s ease;
      border: none;
      cursor: pointer;
      font-size: 1rem;
    }
    
    .btn-primary {
      background: #667eea;
      color: white;
    }
    
    .btn-primary:hover {
      background: #5a6fd8;
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }
    
    .btn-secondary {
      background: #f8f9fa;
      color: #333;
      border: 2px solid #e9ecef;
    }
    
    .btn-secondary:hover {
      background: #e9ecef;
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
    }
    
    .popular-links {
      margin-top: 2rem;
      text-align: left;
      background: #f8f9fa;
      padding: 1.5rem;
      border-radius: 10px;
    }
    
    .popular-links h3 {
      margin: 0 0 1rem 0;
      color: #333;
      font-size: 1.2rem;
    }
    
    .popular-links ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    
    .popular-links li {
      margin: 0.5rem 0;
    }
    
    .popular-links a {
      color: #667eea;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s ease;
    }
    
    .popular-links a:hover {
      color: #5a6fd8;
      text-decoration: underline;
    }
    
    @media (max-width: 768px) {
      .error-code {
        font-size: 6rem;
      }
      
      .error-title {
        font-size: 1.5rem;
      }
      
      .error-container {
        margin: 1rem;
        padding: 1.5rem;
      }
      
      .error-actions {
        flex-direction: column;
        align-items: center;
      }
      
      .btn {
        width: 100%;
        max-width: 300px;
      }
    }
  </style>
</head>
<body>
  <div class="error-container">
    <h1 class="error-code">404</h1>
    <h2 class="error-title" data-lang="error.404.title">Page Not Found</h2>
    <p class="error-message" data-lang="error.404.message">
      Sorry, the page you're looking for doesn't exist. It might have been moved, deleted, or you entered the wrong URL.
    </p>
    
    <div class="error-actions">
      <a href="/" class="btn btn-primary" data-lang="error.404.home">Go to Homepage</a>
      <button onclick="history.back()" class="btn btn-secondary" data-lang="error.404.back">Go Back</button>
    </div>
    
    <div class="popular-links">
      <h3 data-lang="error.404.popular">Popular Pages:</h3>
      <ul>
        <li><a href="/" data-lang="nav.home">🏠 Home - Wplace Paint Tool</a></li>
        <li><a href="/color-converter.html" data-lang="nav.converter">🎨 Color Converter</a></li>
        <li><a href="/blog.html" data-lang="nav.blog">📝 Blog & Tutorials</a></li>
        <li><a href="/about.html" data-lang="nav.about">ℹ️ About Us</a></li>
        <li><a href="/favicon.html">🔗 Favicon Generator</a></li>
      </ul>
    </div>
  </div>

  <script>
    // 统计404错误
    if (typeof gtag !== 'undefined') {
      gtag('event', 'page_view', {
        page_title: '404 Error',
        page_location: window.location.href
      });
    }
    
    // 简单的错误报告
    console.warn('404 Error:', {
      url: window.location.href,
      referrer: document.referrer,
      timestamp: new Date().toISOString()
    });
  </script>
</body>
</html>
