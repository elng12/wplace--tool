# Nginx配置文件（如果你使用Nginx服务器）
server {
    listen 80;
    server_name wplacetool.app www.wplacetool.app;
    return 301 https://wplacetool.app$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.wplacetool.app;
    ssl_certificate /path/to/your/certificate.crt;
    ssl_certificate_key /path/to/your/private.key;
    return 301 https://wplacetool.app$request_uri;
}

server {
    listen 443 ssl http2;
    server_name wplacetool.app;
    
    # SSL证书配置（需要替换为你的实际证书路径）
    ssl_certificate /path/to/your/certificate.crt;
    ssl_certificate_key /path/to/your/private.key;
    
    # SSL安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    
    # 安全头信息
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    # 移除遗留 X-XSS-Protection 头，聚焦 CSP 等现代防护
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # 网站根目录
    root /var/www/wplacetool.app;
    index index.html;
    
    # 静态文件缓存
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # 主要页面
    location / {
        try_files $uri $uri/ =404;
    }

    # 报告模式 CSP 与现代安全头（不破坏现有行为）
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://pagead2.googlesyndication.com https://cdn.ampproject.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://pagead2.googlesyndication.com https://tpc.googlesyndication.com; font-src 'self' data:; connect-src 'self'; frame-src 'self' https://googleads.g.doubleclick.net https://tpc.googlesyndication.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; upgrade-insecure-requests; report-uri /csp-report" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), usb=(), payment=(), browsing-topics=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # CSP 报告接收端点（仅返回 204，用于统计违规）
    location = /csp-report {
        if ($request_method = OPTIONS) { return 204; }
        add_header Content-Type "application/json" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
        return 204;
    }
}
